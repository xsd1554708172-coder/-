name: Generate temporary DOCX files

on:
  pull_request:
    branches:
      - main
    paths:
      - generate_docs.py
      - .github/workflows/generate-docx.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install python-docx
      - name: Generate Word files
        run: python generate_docs.py
      - name: Upload generated documents
        uses: actions/upload-artifact@v4
        with:
          name: shantie-docx
          path: output/*.docx
          if-no-files-found: error
